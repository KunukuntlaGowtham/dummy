name: Build A11y Dummy APK

on:
  push:
    branches: ["main", "ccr-eef0250e-ca4mol"]
    paths:
      - "a11y-dummy/**"
      - ".github/workflows/a11y-dummy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a11y-dummy-apk
  cancel-in-progress: false

defaults:
  run:
    working-directory: a11y-dummy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/A11yDummy.apk"
          ls -l "$GITHUB_WORKSPACE/A11yDummy.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: A11yDummy-apk
          path: A11yDummy.apk

      # One rolling release/tag so there is always a single, stable download
      # link. make_latest is false so it does not disturb other releases.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a11y-dummy-latest
          target_commitish: ${{ github.sha }}
          name: A11y Dummy test app (latest)
          body: |
            Standalone accessibility test-fixture app (15 checkbox cards with popups).
            Built from ${{ github.sha }} (run ${{ github.run_number }}).

            Download: https://github.com/${{ github.repository }}/releases/download/a11y-dummy-latest/A11yDummy.apk
          files: A11yDummy.apk
          make_latest: "false"
