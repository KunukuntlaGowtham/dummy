name: Build engine (loadable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the engine APK (carries classes.dex)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :engine:assembleDebug
          ls -l engine/build/outputs/apk/debug/
          unzip -l engine/build/outputs/apk/debug/engine-debug.apk | grep classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: engine-apk
          path: engine/build/outputs/apk/debug/engine-debug.apk
