name: Build TTD Filler APK

on:
  push:
    branches: ["main", "seva-fast-direct"]
    paths: ["filler/**", ".github/workflows/filler.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filler-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :filler:assembleDebug -PversionCode=${{ github.run_number }}
          cp filler/build/outputs/apk/debug/filler-debug.apk TTDFiller.apk
          ls -l TTDFiller.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filler-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: TTD Filler build ${{ github.run_number }}
          body: |
            TTD Filler - fills the TTD pilgrim details from ttd_db. Built from ${{ github.sha }}.
            Download: https://github.com/${{ github.repository }}/releases/download/filler-${{ github.run_number }}/TTDFiller.apk
          files: TTDFiller.apk
          make_latest: "false"
