name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk DropdownPicker.apk
          ls -l DropdownPicker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DropdownPicker-apk
          path: DropdownPicker.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Dropdown Picker build ${{ github.run_number }}
          body: |
            Debug APK built from ${{ github.sha }}.
            Always-latest download: https://github.com/${{ github.repository }}/releases/latest/download/DropdownPicker.apk
          files: DropdownPicker.apk
          make_latest: "true"
