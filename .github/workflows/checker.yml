name: Build Tick Check APK

on:
  push:
    branches: ["main"]
    paths: ["checker/**", ".github/workflows/checker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checker-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :checker:assembleDebug -PversionCode=${{ github.run_number }}
          cp checker/build/outputs/apk/debug/checker-debug.apk TickCheck.apk
          ls -l TickCheck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TickCheck-apk
          path: TickCheck.apk

      # Its own releases (checker-N), never marked latest: the latest link stays the main app.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: checker-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Tick Check build ${{ github.run_number }}
          body: |
            Tick Check (separate app) built from ${{ github.sha }}.
            Download: https://github.com/${{ github.repository }}/releases/download/checker-${{ github.run_number }}/TickCheck.apk
          files: TickCheck.apk
          make_latest: "false"
