name: Build A11y Inspector APK

on:
  push:
    branches: ["main", "codex/inspector-popup-diagnostics"]
    paths: ["inspector/**", ".github/workflows/inspector.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspector-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :inspector:testDebugUnitTest :inspector:assembleDebug -PversionCode=${{ github.run_number }}
          cp inspector/build/outputs/apk/debug/inspector-debug.apk Gowtham.apk
          ls -l Gowtham.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gowtham-apk
          path: Gowtham.apk

      # What this build has: the last changes, for the release notes.
      - name: Release notes
        run: |
          {
            echo "## What's in this build"
            echo
            git log -8 --pretty=format:'- %s' -- inspector .github/workflows/inspector.yml
            echo
            echo
            echo "**Download:** https://github.com/${{ github.repository }}/releases/download/inspector-${{ github.run_number }}/Gowtham.apk"
            echo
            echo "Built from ${{ github.sha }} (branch ${{ github.ref_name }})."
          } > notes.md

      # Its own releases (inspector-N), never marked latest: the latest link stays the main app.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inspector-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Gowtham build ${{ github.run_number }}
          body_path: notes.md
          files: Gowtham.apk
          make_latest: "false"
