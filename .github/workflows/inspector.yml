name: Build A11y Inspector APK

on:
  push:
    branches: ["main", "ccr-eef0250e-ca4mol"]
    paths:
      - "inspector/**"
      - "app/debug.keystore"
      - ".github/workflows/inspector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspector-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :inspector:assembleDebug -PversionCode=${{ github.run_number }}
          cp inspector/build/outputs/apk/debug/inspector-debug.apk A11yInspector.apk
          ls -l A11yInspector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: A11yInspector-apk
          path: A11yInspector.apk

      # One rolling release/tag so there is always a single, stable download
      # link to the newest build. make_latest is false so it does not disturb
      # the main app's own "latest" release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inspector-latest
          target_commitish: ${{ github.sha }}
          name: A11y Inspector (latest)
          body: |
            Read-only accessibility inspector. Built from ${{ github.sha }} (run ${{ github.run_number }}).

            Download: https://github.com/${{ github.repository }}/releases/download/inspector-latest/A11yInspector.apk
          files: A11yInspector.apk
          make_latest: "false"
